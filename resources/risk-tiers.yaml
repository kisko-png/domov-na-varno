# DEMO VALUES - not clinically validated.
# Silence thresholds are hours since the due time of the earliest missed check-in slot (see :Silence:).
HIGH:
  checkInSchedule:
    - { fromDay: 1, toDay: 3, perDay: 2 }
    - { fromDay: 4, toDay: 30, perDay: 1 }
  durationDays: 30
  painTolerance: 1
  silence: { yellowAfterHours: 12, redAfterHours: 24 }
MEDIUM:
  checkInSchedule:
    - { fromDay: 1, toDay: 14, perDay: 1 }
  durationDays: 14
  painTolerance: 2
  silence: { yellowAfterHours: 24, redAfterHours: 48 }
LOW:
  checkInSchedule:
    - { fromDay: 1, toDay: 7, perDay: 1 }
    - { fromDay: 8, toDay: 14, days: [8, 10, 12] }
  durationDays: 14
  painTolerance: 3
  silence: { yellowAfterHours: 48, redAfterHours: 72 }
